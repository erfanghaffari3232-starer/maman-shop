<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه مامان | محصولات خونگی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- بنر تخفیف -->
    <div class="top-banner">🚀 ارسال رایگان برای سفارش‌های بالای ۵۰۰ هزار تومان!</div>

    <!-- هدر -->
    <header class="header" id="header"></header>

    <!-- اسلایدر -->
    <section class="slider" id="slider"></section>

    <!-- دسته‌بندی -->
    <nav class="cat-nav" id="catNav"></nav>

    <!-- محتوای اصلی -->
    <main class="main-content">
        <aside class="filters" id="filters"></aside>
        <section class="products-area">
            <div class="products-header" id="productsHeader"></div>
            <div class="products-grid" id="productsGrid"></div>
        </section>
    </main>

    <!-- سبد خرید -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <aside class="cart-panel" id="cartPanel"></aside>

    <!-- فوتر -->
    <footer class="footer" id="footer"></footer>

    <script src="script.js"></script>
</body>
</html>
